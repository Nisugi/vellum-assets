name: Submit status icons
description: Status glyph set (zip of one or more images)
title: "[Status] "
labels: ["submission", "category:statusicons"]
body:
  - type: markdown
    attributes:
      value: |
        Attach **a single image** (and pick its role below) or **one .zip** of glyphs.
        Zip entries are named for their role — `<role>.png` uses your set name as prefix;
        `<anything>_<role>.png` keeps its own prefix. Roles:
        `standing` `kneeling` `sitting` `prone` `dead` `stunned` `bleeding` `hidden`
        `invisible` `webbed` `poisoned` `diseased` `joined`.
        (Hand icons have their own submission form.)
        A partial set is fine. Each glyph should be a single bold pictogram readable at
        20px. Solid black backgrounds are made transparent automatically. Your files will
        be published as `<set name>_<role>.png`.
  - type: input
    id: name
    attributes:
      label: Set name
      description: Lowercase letters, numbers, `_` and `-` only. Prefixes every file in the set.
      placeholder: inkline
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author credit
      description: Shown in the gallery.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated.
  - type: textarea
    id: image
    attributes:
      label: Image or zip
      description: Drag and drop a single image or one .zip here.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role (single image only)
      description: When attaching one image instead of a zip, pick what it is.
      options:
        - standing
        - kneeling
        - sitting
        - prone
        - dead
        - stunned
        - bleeding
        - hidden
        - invisible
        - webbed
        - poisoned
        - diseased
        - joined
  - type: input
    id: threshold
    attributes:
      label: Background threshold (advanced)
      description: >-
        Leave blank normally. If the processed results show a dark halo, edit this to a
        higher value like 40 and the submission re-runs; if dark details get erased,
        lower it. Applies to every image in the zip.
