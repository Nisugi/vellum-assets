name: Submit hand icons
description: Left, right, and spell hand icons for the hands widget (zip of one or more images)
title: "[Hands] "
labels: ["submission", "category:hands"]
body:
  - type: markdown
    attributes:
      value: |
        Attach **a single image** (and pick its role below) or **one .zip** of images.
        Zip entries are named for their role — `<role>.png` uses your set name as prefix;
        `<anything>_<role>.png` keeps its own prefix, so one zip can carry many
        differently-named icons of the same role. Roles:
        `lefthand` (open left hand), `righthand` (open right hand), `spellhand` (hand with
        a rune circle above the palm).
        A partial set is fine. Each icon should be a single bold pictogram readable at
        20px. Solid black backgrounds are made transparent automatically.
  - type: input
    id: name
    attributes:
      label: Set name
      description: Lowercase letters, numbers, `_` and `-` only. Prefixes every file in the set.
      placeholder: inkline
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author credit
      description: Shown in the gallery.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated.
  - type: textarea
    id: image
    attributes:
      label: Image or zip
      description: Drag and drop a single image or one .zip here.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role (single image only)
      description: When attaching one image instead of a zip, pick what it is.
      options:
        - lefthand
        - righthand
        - spellhand
  - type: input
    id: threshold
    attributes:
      label: Background threshold (advanced)
      description: >-
        Leave blank normally. If the processed results show a dark halo, edit this to a
        higher value like 40 and the submission re-runs; if dark details get erased,
        lower it. Applies to every image in the zip.
