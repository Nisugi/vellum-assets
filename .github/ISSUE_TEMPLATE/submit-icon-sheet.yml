name: Submit a hotbar icon sheet
description: A sprite sheet of square ability icons for hotbar buttons
title: "[Icons] "
labels: ["submission", "category:icons"]
body:
  - type: markdown
    attributes:
      value: |
        **Requirements:** square cells, **no padding between cells**, indexed left→right then
        top→bottom. Cell boundaries must land exactly on the cell size (e.g. a 4x4 sheet of
        64px cells is exactly 256x256) — drifted boundaries bleed neighbors into buttons.
        Sheets are used as-is; no background removal is applied.
  - type: input
    id: name
    attributes:
      label: Asset name
      description: Lowercase letters, numbers, `_` and `-` only.
      placeholder: combat_icons
    validations:
      required: true
  - type: input
    id: cell
    attributes:
      label: Cell size (px)
      description: The exact pixel size of one square cell.
      placeholder: "64"
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author credit
      description: Shown in the gallery.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ideally include what each cell index is.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated.
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Drag and drop your sheet here.
    validations:
      required: true
