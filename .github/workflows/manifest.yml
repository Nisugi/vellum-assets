name: Build manifests and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish before the next starts; don't cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: accurate last_commit times
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Generate manifests
        run: ruby build_manifest.rb --root .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .               # publish the whole repo (assets + manifests)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
