# NishiFront21 - storm-family, curated to full parity. Steel-blue scheme.
[meta]
name = "NishiFront21"
description = "Curated from Wrayth's NishiFront v3.1 skin"

[ui]
window_bg = "#0a1420"
panel_bg = "#0f1e2c"
menu_bg = "#0a1420"
button_bg = "#152534"
button_hover = "#1e3850"
text = "#c6d2e0"
accent = "#5b8fc8"
border = "#243a52"
titlebar_text = "#1a2430"
# Combat/dialog button labels sit on the light SILVER button art, so dark.
button_text = "#1a2028"

[window.default.background]
image = "bg/panel.png"
fit = "tile"

[window.default.border]
image = "frames/client.png"
slice = [3.0, 3.0, 3.0, 3.0]
scale = 1.0

[controls.titlebar]
image = "frames/panel.png"
slice = [13.0, 50.0, 0.0, 8.0]
scale = 1.0

[edges.right]
strip = "frames/vertical.png"
tile = true
ornament = "frames/flourish.png"
anchor = "start"
thickness = 3.0
scale = 1.0

[controls.button]
image = "controls/button.png"
slice = [4.0, 6.0, 4.0, 6.0]
scale = 1.0

[controls."button.hover"]
image = "controls/button_alt.png"
slice = [4.0, 6.0, 4.0, 6.0]
scale = 1.0

[controls.dropdown]
image = "controls/dropdown.png"
slice = [3.0, 3.0, 3.0, 3.0]
scale = 1.0

[icons]
lefthand = "icons/lefthand.png"
righthand = "icons/righthand.png"
spellhand = "icons/spellhand.png"
swordbtn = "icons/swordbtn.png"
noswordbtn = "icons/noswordbtn.png"
shieldbtn = "icons/shieldbtn.png"
noshieldbtn = "icons/noshieldbtn.png"
standing = "icons/standing.png"
kneeling = "icons/kneeling.png"
sitting = "icons/sitting.png"
prone = "icons/prone.png"
dead = "icons/dead.png"
poisoned = "icons/poisoned.png"
diseased = "icons/diseased.png"
bleeding = "icons/bleeding.png"
stunned = "icons/stunned.png"

[compass]
rose = "compass/rose.png"
n = "compass/n.png"
ne = "compass/ne.png"
e = "compass/e.png"
se = "compass/se.png"
s = "compass/s.png"
sw = "compass/sw.png"
w = "compass/w.png"
nw = "compass/nw.png"
up = "compass/up.png"
down = "compass/down.png"
out = "compass/out.png"

[injury_doll]
base = "doll/base.png"

[injury_doll.dots]
wound_color = "#e02020"
scar_color = "#f08040"
opacity = 0.9
diameter = 0.06

[injury_doll.nsys]
injury1 = "doll/nerves1.png"
injury2 = "doll/nerves2.png"
injury3 = "doll/nerves3.png"

[injury_doll.anchors]
abdomen = [0.5628, 0.3562]
back = [0.2022, 0.7639]
chest = [0.574, 0.2428]
head = [0.5571, 0.0619]
leftarm = [0.7825, 0.3041]
lefteye = [0.8557, 0.0895]
lefthand = [0.7768, 0.4972]
leftleg = [0.7092, 0.6474]
neck = [0.5628, 0.1539]
nsys = [0.9458, 0.7915]
rightarm = [0.3938, 0.3041]
righteye = [0.2304, 0.0956]
righthand = [0.2755, 0.4788]
rightleg = [0.4445, 0.6597]
